<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Register | NTP</title>
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> -->
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div id="ff">
    <div id="sr">
      <h1>NTP</h1>
      <h2>🧑‍🎓 Student Registration</h2>
    </div>

    <form id="registerForm">
      <label for="fullName">Full Name</label>
      <input type="text" id="fullName" placeholder="Full name" required>

      <label for="regUsername">Username</label>
      <input type="text" id="regUsername" placeholder="Username" required>

      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="Password" required>

      <label for="regConfirmPassword">Confirm Password</label>
      <input type="password" id="regConfirmPassword" placeholder="Confirm Password" required>

      <label for="regEmail">Email</label>
      <input type="email" id="regEmail" placeholder="Email" required>

      <label for="regNumber">Phone Number</label>
      <input type="tel" id="regNumber" placeholder="Mobile number" required>

      <label for="regCourse">Course</label>
      <select id="regCourse" required>
        <option value="" disabled selected>Select your course</option>
        <option value="Cyber Security">Cyber Security</option>
        <option value="Web Development">Web Development</option>
        <option value="AI/ML">AI/ML</option>
        <option value="Data Science">Data Science</option>
        <option value="Data Analytics">Data Analytic</option>
        <option value="Android Development">Android Development</option>
        <option value="UI/UX">UI/UX</option>
        <option value="Cloud Computing">Cloud Computing</option>
      </select>



      <input type="checkbox" id="terms" name="terms">
      <label for="terms">Agree to terms and conditions</label>

      <button class="button" type="submit">Register</button>

      <p style="text-align:center;">Already have an account? <a href="/login">Login here</a></p>

    </form>
  </div>

  <p id="registerMessage"></p>


  <!-- <script src="{{ url_for('static', filename='register.js') }}"></script> -->
  <script src="/static/register.js"></script>


  <link rel="stylesheet" href="/static/footer.css"> <!-- always after -->
</body>

</html>
