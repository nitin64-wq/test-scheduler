<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | NTP</title>
  <link rel="stylesheet" href="/static/style.css">
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}"> -->
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <div class="icon">🔐</div>
      <h2>Login to NTP</h2>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username or Email</label>
        <input type="text" id="username" placeholder="Enter your username or email" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <!-- <div class="form-group">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="">Select your role</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </div> -->

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p id="loginMessage" class="login-message"></p>

    <div class="register-prompt">
      <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
  </div>
  <!-- <script src="{{ url_for('static', filename='login.js') }}"></script> -->
  <script src="/static/logic.js"></script>


  <link rel="stylesheet" href="/static/footer.css"> <!-- always after -->
</body>

</html>
