<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Student Dashboard</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='footer.css') }}">
  <!-- <link rel="stylesheet" href="{{ url_for('static', filename='styles1.css') }}"> -->
  <link rel="stylesheet" href="/static/style1.css">
  <link rel="stylesheet" href="/static/student-sidebar.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
  <div class="student-layout">
    <!-- Sidebar -->
    <aside class="student-sidebar">
      <div class="sidebar-header">
        <h2><i class="fas fa-user-graduate"></i> Student</h2>
      </div>
      <nav class="sidebar-nav">
        <a href="#" class="nav-link active" data-target="overview-section"><i class="fas fa-home"></i> Overview</a>
        <a href="#" class="nav-link" data-target="profile-section"><i class="fas fa-user"></i> Profile</a>
        <a href="#" class="nav-link" data-target="progress-section"><i class="fas fa-chart-line"></i> Progress &
          Matrix</a>
        <a href="#" class="nav-link" data-target="exams-section"><i class="fas fa-file-alt"></i> Exams</a>
      </nav>
      <div class="sidebar-footer">
        <button onclick="logout()" class="logout-btn-sidebar"><i class="fas fa-sign-out-alt"></i> Logout</button>
      </div>
    </aside>

    <main class="student-main">
      <header class="dashboard-header">
        <h2>🎓 Welcome back, <span id="studentName"></span> <span id="studentCourseBadge"
            style="font-size: 0.6em; background: #3498db; color: white; padding: 2px 8px; border-radius: 4px; vertical-align: middle;"></span>
        </h2>
        <button onclick="logout()" class="logout-btn" style="display:none;">Logout</button>
        <!-- Hidden in header for desktop -->
      </header>

      <div class="dashboard-container">
        <section id="overview-section" class="quick-stats">
          <h3>Your Study Overview</h3>
          <div class="stats-grid">
            <div class="stat-card">
              <span id="testsGivenCount">0</span>
              <p>Tests Given</p>
            </div>
            <div class="stat-card">
              <span id="testsLeftCount">0</span>
              <p>Tests Left</p>
            </div>
          </div>
        </section>

        <!-- Profile Section -->
        <section id="profile-section" class="profile-section" style="display:none;">
          <h3>👤 My Profile</h3>
          <div class="card" style="max-width: 600px; margin: 20px auto; padding: 30px;">
            <div style="margin-bottom: 20px;">
              <label style="display:block; font-weight:bold; margin-bottom:5px;">Full Name</label>
              <input type="text" id="profileName" readonly
                style="width:100%; padding:10px; border:1px solid #ddd; background:#f9f9f9; border-radius:4px;">
            </div>
            <div style="margin-bottom: 20px;">
              <label style="display:block; font-weight:bold; margin-bottom:5px;">Username</label>
              <input type="text" id="profileUsername" readonly
                style="width:100%; padding:10px; border:1px solid #ddd; background:#f9f9f9; border-radius:4px;">
            </div>
            <div style="margin-bottom: 20px;">
              <label style="display:block; font-weight:bold; margin-bottom:5px;">Email</label>
              <input type="text" id="profileEmail" readonly
                style="width:100%; padding:10px; border:1px solid #ddd; background:#f9f9f9; border-radius:4px;">
            </div>
            <div style="margin-bottom: 20px;">
              <label style="display:block; font-weight:bold; margin-bottom:5px;">Phone</label>
              <input type="text" id="profilePhone" readonly
                style="width:100%; padding:10px; border:1px solid #ddd; background:#f9f9f9; border-radius:4px;">
            </div>
            <div style="margin-bottom: 20px;">
              <label style="display:block; font-weight:bold; margin-bottom:5px;">Course</label>
              <input type="text" id="profileCourse" readonly
                style="width:100%; padding:10px; border:1px solid #ddd; background:#f9f9f9; border-radius:4px;">
            </div>
          </div>
        </section>

        <!-- Progress Tracker -->
        <!-- Progress & Matrix Combined -->
        <section id="progress-section" class="progress-section">
          <h3>📈 Your Progress</h3>
          <div class="progress-bar" style="margin-bottom: 30px;">
            <div class="progress-fill" id="progressFill" style="width: 0%;">0%</div>
          </div>

          <h2>📊 Learning Progress Matrix</h2>
          <div class="matrix-container">
            <div class="matrix-header">
              <div class="matrix-cell">Subject</div>
              <div class="matrix-cell">Not Started</div>
              <div class="matrix-cell">In Progress</div>
              <div class="matrix-cell">Completed</div>
              <div class="matrix-cell">Mastered</div>
            </div>
            <div id="matrixRows">
              <!-- Rows will be dynamically injected here -->
            </div>
          </div>
        </section>


        <div id="exams-section" class="quiz-section">
          <h2>Available Exams</h2>
          <div id="examList" class="quiz-list"></div>
        </div>

      </div> <!-- End dashboard-container -->

      <script>
        function logout() {
          // Clear both localStorage and sessionStorage
          localStorage.removeItem('user');
          localStorage.removeItem('studentData');
          sessionStorage.removeItem('authUser');

          // Redirect to login
          window.location.href = '/login';
        }
      </script>

    </main>
  </div>

  <link rel="stylesheet" href="/static/footer.css"> <!-- always after -->
</body>
