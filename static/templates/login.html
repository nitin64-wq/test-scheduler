<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | Monday Test Planner</title>
  <link rel="stylesheet" href="/static/style.css">
</head>

<body>
  <div class="login-container">
    <div class="login-header">
      <div class="icon">🔐</div>
      <h2>Login to Monday Test Planner</h2>
    </div>

    <form id="loginForm">
      <div class="form-group">
        <label for="username">Username</label>
        <input type="text" id="username" placeholder="Enter your username" required />
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <input type="password" id="password" placeholder="Enter your password" required />
      </div>

      <div class="form-group">
        <label for="role">Role</label>
        <select id="role" required>
          <option value="">Select your role</option>
          <option value="student">Student</option>
          <option value="admin">Admin</option>
        </select>
      </div>

      <button type="submit" class="login-btn">Login</button>
    </form>

    <p id="loginMessage" class="login-message"></p>

    <div class="register-prompt">
      <p>Don't have an account? <a href="/register">Register here</a></p>
    </div>
  </div>

  <script src="/static/logic.js"></script>

  <!-- Proper footer -->
  <footer class="footer">
    <div class="footer-container">
      <p class="project-name">📘 Monday Test Planner</p>
      <p class="team">Team Members: <strong>Nitin Kumar</strong>, <strong>Jyoti Bishnoi</strong>, <strong>Sansarsagar
          Singh</strong></p>
      <p class="mentor">Mentor: <strong>Ms. Makinder Kaur</strong></p>
    </div>
  </footer>

</body>

</html>
